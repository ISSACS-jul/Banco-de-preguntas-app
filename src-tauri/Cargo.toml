[package]
name = "banco-preguntas"
version = "0.1.0"
description = "Banco de Preguntas & Generador de Evaluaciones"
authors = ["Docente"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rfd = "0.18.0"
